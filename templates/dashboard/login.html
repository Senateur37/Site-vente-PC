{% load static %}
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#030712">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
  <title>Connexion | TechShop Admin</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #030712;
      overflow: hidden;
    }

    /* Animated Glowing Blobs */
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
      animation: blob-bounce 10s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }
    .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #7e22ce, #3b82f6); }
    .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, #db2777, #4f46e5); animation-delay: -5s; }
    
    @keyframes blob-bounce {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 10%) scale(1.1); }
      100% { transform: translate(-5%, -10%) scale(0.9); }
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    /* Modern Inputs */
    .modern-input {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modern-input:focus {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(168, 85, 247, 0.5); /* purple-500 */
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2), inset 0 0 0 1px rgba(168, 85, 247, 0.2);
      transform: translateY(-2px);
    }
    
    .modern-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* Animated Gradient Button */
    .gradient-btn {
      background-size: 200% 200%;
      background-image: linear-gradient(to right, #4f46e5, #c026d3, #db2777, #4f46e5);
      animation: gradient-shift 4s ease infinite;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px -5px rgba(192, 38, 211, 0.4);
    }
    .gradient-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 30px -5px rgba(192, 38, 211, 0.6);
    }
    
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Entrance Animation */
    .fade-up {
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-4">

  <!-- Animated Background -->
  <div class="blob blob-1 rounded-full"></div>
  <div class="blob blob-2 rounded-full"></div>

  <!-- Main Container -->
  <div class="w-full max-w-[420px] relative z-10 fade-up">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-[2rem] bg-white/5 border border-white/10 shadow-2xl backdrop-blur-md mb-6 rotate-3 hover:rotate-0 transition-transform duration-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">TECH<span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">SHOP</span></h1>
      <p class="text-sm font-medium text-slate-400/80 uppercase tracking-[0.25em]">Control Panel</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-[2rem] p-8 sm:p-10 relative">
      
      <!-- Messages -->
      {% if messages %}
        <div class="mb-6 space-y-3">
        {% for message in messages %}
          <div class="px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-3 border backdrop-blur-md
            {% if message.tags == 'error' %}bg-red-500/10 text-red-300 border-red-500/30{% endif %}
            {% if message.tags == 'success' %}bg-emerald-500/10 text-emerald-300 border-emerald-500/30{% endif %}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
        </div>
      {% endif %}

      <form method="post" class="space-y-6">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        
        <div class="space-y-2">
          <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-widest pl-1">Identifiant</label>
          <input type="text" name="username" id="username" required autocomplete="username" autofocus
                 placeholder="admin"
                 class="modern-input block w-full px-5 py-4 text-base rounded-2xl outline-none" />
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between pl-1">
            <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-widest">Mot de passe</label>
            <a href="{% url 'dashboard:mot_de_passe_oublie' %}" class="text-xs font-medium text-purple-400 hover:text-pink-400 transition-colors">Oublié ?</a>
          </div>
          <input type="password" name="password" id="password" required autocomplete="current-password"
                 placeholder="••••••••"
                 class="modern-input block w-full px-5 py-4 text-base rounded-2xl outline-none" />
        </div>

        <div class="pt-4">
          <button type="submit"
                  class="gradient-btn w-full flex items-center justify-center gap-2 py-4 px-6 text-base font-bold text-white rounded-2xl shadow-lg">
            S'authentifier
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </form>
    </div>

    <div class="mt-8 text-center">
      <a href="{% url 'produits:liste' %}" class="inline-flex items-center gap-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Retour à la boutique
      </a>
    </div>
  </div>

</body>
</html>
