{% load static %}
<!DOCTYPE html>
<html lang="fr" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email envoyé — TechShop</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">

  <div class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm text-center">
      <div class="bg-surface dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-8 shadow-sm">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="text-lg font-bold text-slate-900 dark:text-white mb-2">Email envoyé</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">
          Si un compte existe avec cet email, vous recevrez un lien pour réinitialiser votre mot de passe.
        </p>
        <a href="{% url 'dashboard:login' %}" class="inline-block mt-6 text-sm text-accent hover:text-accentdark font-medium transition">← Retour à la connexion</a>
      </div>
  </div>
    </div>
  </div>
  <button id="theme-toggle" type="button"
          class="fixed bottom-4 right-4 w-10 h-10 rounded-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:border-accent hover:text-accent dark:hover:border-accent dark:hover:text-accent flex items-center justify-center shadow-md transition z-50"
          aria-label="Basculer le mode sombre/clair">
    <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
    <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
  </button>

  
  <script>
    (function() {
      const htmlEl = document.documentElement;
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
        htmlEl.classList.add('dark');
      } else {
        htmlEl.classList.remove('dark');
      }
      const toggleBtn = document.getElementById('theme-toggle');
      const iconSun = document.getElementById('theme-icon-sun');
      const iconMoon = document.getElementById('theme-icon-moon');
      function updateIcons() {
        const isDark = htmlEl.classList.contains('dark');
        iconSun.classList.toggle('hidden', !isDark);
        iconMoon.classList.toggle('hidden', isDark);
      }
      updateIcons();
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          htmlEl.classList.toggle('dark');
          const isDark = htmlEl.classList.contains('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          updateIcons();
        });
      }
    })();
  </script>
  
</body>
</html>
