{% extends "dashboard/base_admin.html" %}
{% block title %}Confirmer la suppression — TechShop{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto text-center py-8">
  <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-5">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
    </svg>
  </div>

  <h1 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Confirmer la suppression</h1>
  <p class="text-slate-500 dark:text-slate-400 mb-8">
    Êtes-vous sûr de vouloir supprimer <strong class="text-slate-700 dark:text-slate-300">{{ objet.nom|default:objet }}</strong> ?
    Cette action est irréversible.
  </p>

  <form method="post" class="flex flex-col sm:flex-row gap-3 justify-center">
    {% csrf_token %}
    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-6 py-2.5 rounded-md text-center">
      Oui, supprimer
    </button>
    <a href="{{ request.META.HTTP_REFERER|default:'javascript:history.back()' }}" class="border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-semibold px-6 py-2.5 rounded-md hover:border-accent text-center">
      Annuler
    </a>
  </form>
</div>

{% endblock %}
