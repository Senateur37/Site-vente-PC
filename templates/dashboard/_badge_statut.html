<span class="badge
  {% if statut == 'en_attente' %}bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300
  {% elif statut == 'en_livraison' %}bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300
  {% elif statut == 'livree_payee' %}bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300
  {% elif statut == 'annulee' %}bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300
  {% else %}bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300{% endif %}">{{ libelle }}</span>
