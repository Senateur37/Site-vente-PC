# docker-compose.yml -- Deploiement Coolify
# PostgreSQL : service externe Coolify (pas dans ce compose)
# Redis     : service interne
services:

  # Application Django
  web:
    build: .
    image: techshop-web
    restart: unless-stopped
    volumes:
      - media_data:/app/media
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      SITE_URL: ${SITE_URL}
      USE_HTTPS: ${USE_HTTPS:-True}
      USE_PROXY_HEADERS: ${USE_PROXY_HEADERS:-True}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    depends_on:
      redis:
        condition: service_started
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn techshop.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"]

  # Redis (cache / sessions)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis_data:
  media_data:
